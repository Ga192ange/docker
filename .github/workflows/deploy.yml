name: Publicar imagen en Docker Hub

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101 # Ignorar los archivos  test

      - name: Ejecutar las pruebas
        run: pytest

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: garcia20/mi-ejemplo:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'garcia20/mi-ejemplo:latest'
          format: 'table'
          exit-code: '1' # Si se encuentra alguna falla, rompe la ejecución
          ignore-unfixed: true 
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Son los que van a detener la ejecucion

      - name: Subirla imagen a Docker Hub
        run: docker push garcia20/mi-ejemplo:latest

      - name: Desplegar el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/docker
            docker compose pull app-backend
            docker compose up -d